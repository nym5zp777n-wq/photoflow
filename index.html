<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="摄影档期" />
<meta name="theme-color" content="#9caa8a" />
<title>摄影档期 · 2026</title>
<style>
  :root{
    --cream:#fbf4e9; --cream-2:#f4ebd6; --paper:#fffdf8;
    --ink:#4a4034; --ink-soft:#7a6f5e; --line:#ece0cc;
    --sage:#9caa8a; --sage-deep:#5c7152; --sage-soft:#e6efdf;
    --peach:#ef9a7d; --peach-deep:#c77a5c; --peach-soft:#fbe4d8;
    --gold:#dca63c; --gold-soft:#f8ecc9;
    --brick:#b5533c; --brick-soft:#f1d9cf;
    --shadow:0 6px 20px rgba(120,90,50,.12);
    --tab-h:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
    min-height:100vh;padding-top:env(safe-area-inset-top)}

  /* 顶部 sticky header */
  header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(var(--cream),rgba(251,244,233,.92));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .logo{width:38px;height:38px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--sage),var(--gold));box-shadow:var(--shadow);position:relative}
  .logo:after{content:"";position:absolute;inset:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8, transparent 60%), var(--cream-2);
    box-shadow:inset 0 0 0 3px var(--brick-soft)}
  header .ttl{flex:1;min-width:0}
  header h1{font-size:19px;margin:0;letter-spacing:.5px;color:var(--ink)}
  header .sub{color:var(--ink-soft);font-size:11px;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #setTokenBtn{border:none;background:var(--cream-2);border:1px solid var(--line);
    border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:0 0 auto}
  #setTokenBtn:active{background:var(--sage-soft)}

  .app{max-width:680px;margin:0 auto}

  /* 视图切换 */
  .view{padding:14px 14px 24px;display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 卡片通用 */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:11px;font-weight:600;color:var(--sage);background:var(--sage-soft);
    border-radius:999px;padding:2px 10px}

  /* 表单 */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
  .field input,.field select{
    width:100%;font-size:16px;padding:12px 12px;border:1px solid var(--line);
    border-radius:12px;background:var(--cream-2);color:var(--ink);-webkit-appearance:none;appearance:none}
  .field input:focus,.field select:focus{outline:none;border-color:var(--sage);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sec-title{font-size:13px;font-weight:700;color:var(--brick);margin:14px 0 6px;
    border-left:4px solid var(--gold);padding-left:8px}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
    font-weight:700;cursor:pointer;transition:.15s}
  .btn-save{background:linear-gradient(135deg,var(--sage),#7c9470);color:#fff;box-shadow:var(--shadow)}
  .btn-save:active{transform:scale(.99)}
  .btn-ghost{background:var(--cream-2);color:var(--ink-soft);border:1px solid var(--line);margin-top:10px}

  /* 录入页列表 */
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer}
  .row:active{background:var(--cream-2)}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dt{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .dots{display:flex;gap:6px}
  .dots i{width:13px;height:13px;border-radius:50%;background:#e3d8c4;display:inline-block}
  .dots i.on.shoot{background:var(--sage)}
  .dots i.on.deliver{background:var(--gold)}
  .dots i.on.invoice{background:var(--peach)}
  .dots i.on.paid{background:var(--brick)}
  .empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:18px 0}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink-soft);margin:4px 2px 10px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{width:10px;height:10px;border-radius:50%}

  /* 档期页：筛选 chips */
  .chips{display:flex;gap:10px;margin-bottom:10px}
  .chip{flex:1;min-height:44px;border:1px solid var(--line);background:var(--cream);color:var(--ink-soft);
    border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff}
  .hint{font-size:12px;color:var(--ink-soft);margin:0 2px 12px;text-align:center;line-height:1.5}

  /* 档期页：概览 */
  .ov{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .ov .box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
  .ov .lbl{font-size:11px;color:var(--ink-soft)}
  .ov .num{font-size:20px;font-weight:700;color:var(--sage-deep);font-variant-numeric:tabular-nums;margin-top:2px}
  .ov .num.peach{color:var(--peach-deep)}
  .ov .num.gold{color:var(--gold)}

  /* 档期页：卡片 */
  .scard{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;cursor:pointer}
  .date-badge{flex:0 0 auto;text-align:center;background:var(--cream-2);border-radius:12px;padding:6px 10px;min-width:56px}
  .date-badge .d{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
  .date-badge .m{font-size:11px;color:var(--ink-soft)}
  .card-main{flex:1;min-width:0}
  .card-title{font-weight:600;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
  .tag.direct{background:rgba(220,166,60,.22);color:#9C7A2C}
  .tag.friend{background:rgba(156,170,138,.22);color:var(--sage-deep)}
  .tag.type{background:var(--cream-2);color:var(--ink-soft)}
  .card-sub{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .sdots{display:inline-flex;gap:5px}
  .sdot{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff;cursor:pointer}
  .sdot.on{border-color:var(--sage);background:var(--sage);color:#fff}
  .sdot.on.deliver{border-color:var(--gold);background:var(--gold);color:#fff}
  .sdot.on.invoice{border-color:var(--peach);background:var(--peach);color:#fff}
  .sdot.on.paid{border-color:var(--brick);background:var(--brick);color:#fff}
  .sdot:active{transform:scale(.9)}
  .cnt{font-size:12px;color:var(--ink-soft)}
  .cal-badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .cal-badge.synced{background:rgba(156,170,138,.18);color:var(--sage-deep);border-color:transparent}
  .cal-badge.unsynced{background:rgba(181,83,60,.1);color:var(--brick);border-color:transparent}
  .chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .2s;font-size:14px}
  .scard.open .chev{transform:rotate(180deg)}
  .card-detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .scard.open .card-detail{max-height:1500px}
  .detail-inner{padding:14px 16px;border-top:1px solid var(--line)}
  .rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
  .row2{background:var(--cream-2);border-radius:10px;padding:8px 10px;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .row2 .k{font-size:11px;color:var(--ink-soft)}
  .row2 .v{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-word}
  .row2 .v.money{color:var(--peach-deep)}
  .steps-row{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
  .step{flex:1;min-width:64px;text-align:center;background:var(--cream-2);border-radius:10px;padding:8px 4px;font-size:12px;cursor:pointer;transition:transform .12s}
  .step .sd{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;
    font-size:11px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff}
  .step.done .sd{border-color:var(--sage);background:var(--sage);color:#fff}
  .step.done.deliver .sd{border-color:var(--gold);background:var(--gold);color:#fff}
  .step.done.invoice .sd{border-color:var(--peach);background:var(--peach);color:#fff}
  .step.done.paid .sd{border-color:var(--brick);background:var(--brick);color:#fff}
  .step .sl{color:var(--ink-soft)}
  .step.done .sl{color:var(--sage-deep);font-weight:600}
  .step:active{transform:scale(.97)}
  .notes-box{font-size:13px;color:var(--ink-soft);background:var(--cream-2);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;min-height:44px}

  /* 行内编辑通用样式 */
  .editable{cursor:pointer;border-radius:8px;padding:1px 4px;margin:-1px -4px;position:relative;
    transition:background .15s, box-shadow .15s;outline:none}
  .editable:hover{background:var(--sage-soft)}
  .editable:active{background:var(--cream-2)}
  .editable.empty{color:var(--ink-soft);font-style:italic}
  .editable::after{content:"✎";font-size:10px;margin-left:5px;color:var(--sage);opacity:.28;font-style:normal}
  .editable.empty::after{opacity:.45}
  .db-ed{padding:4px;border-radius:10px}
  .nm-ed{font-weight:700}
  .inline-input{width:100%;font-size:14px;padding:7px 8px;border:1.5px solid var(--sage);border-radius:9px;
    background:#fff;color:var(--ink);font-family:inherit;box-sizing:border-box}
  .inline-input:focus{outline:none;box-shadow:0 0 0 3px var(--sage-soft)}
  select.inline-input{-webkit-appearance:none;appearance:none}

  /* 财务页 */
  .fin-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;
    box-shadow:var(--shadow);border-left:5px solid var(--gold)}
  .fin-card.friend{border-left-color:var(--sage)}
  .fin-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .fin-name{font-size:18px;font-weight:700;color:var(--ink)}
  .fin-cnt{font-size:12px;color:var(--ink-soft)}
  .amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .amt{background:var(--cream-2);border-radius:12px;padding:12px;text-align:center}
  .amt .k{font-size:11px;color:var(--ink-soft)}
  .amt .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .amt.rev .v{color:var(--peach-deep)}
  .amt.inv .v{color:var(--sage-deep)}
  .amt.uninv .v{color:var(--brick)}
  .bar-wrap{margin-top:4px}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .bar-label b{color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{height:14px;background:var(--cream-2);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-deep));border-radius:999px;transition:width .4s}
  .fin-flag{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:10px;line-height:1.5}
  .fin-flag.warn{background:rgba(181,83,60,.12);color:var(--brick)}
  .fin-flag.ok{background:rgba(156,170,138,.18);color:var(--sage-deep)}
  .fin-flag.info{background:var(--cream-2);color:var(--ink-soft)}
  .fin-detail{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .fin-detail .fh{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;padding:0 2px}
  .fin-row{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px dashed var(--line)}
  .fin-row:last-child{border-bottom:none}
  .fin-rn{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fin-ramt{font-size:14px;font-weight:700;color:var(--peach-deep);text-align:right;font-variant-numeric:tabular-nums}

  /* 底部 Tab 栏 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--ink-soft);font-size:12px;font-weight:500;cursor:pointer;min-height:var(--tab-h)}
  .tab .ic{font-size:20px;line-height:1;transition:transform .15s}
  .tab.active{color:var(--sage-deep)}
  .tab.active .ic{transform:scale(1.12)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
    transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;
    border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);z-index:20;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:720px){
    h1{font-size:22px}
    .ov{grid-template-columns:repeat(4,1fr)}
    .rows{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"></div>
    <div class="ttl">
      <h1>📷 摄影档期</h1>
      <div class="sub">更新于 <span id="upd">--</span> · 共 <span id="totalCnt">--</span> 条</div>
    </div>
    <button id="setTokenBtn" title="设置 GitHub token">⚙</button>
  </header>

  <!-- 视图一：档期（默认） -->
  <section class="view active" id="view-schedule">
    <div class="chips" id="chips"></div>
    <div class="ov" id="ov"></div>
    <p class="hint">点任意文字 / 数字 / 日期 / 状态点即可直接修改，并实时写回 GitHub</p>
    <div id="cards"></div>
    <div id="empty" class="fin-flag info" style="display:none;text-align:center">暂无符合条件的档期</div>
  </section>

  <!-- 视图二：录入 -->
  <section class="view" id="view-input">
    <section class="card">
      <h2>录入 / 编辑 <span class="tag" id="modeTag">新增</span></h2>
      <form id="form" autocomplete="off">
        <input type="hidden" id="f_id" />

        <div class="field">
          <label>项目名 *</label>
          <input id="f_name" type="text" placeholder="如 温莎拍摄" />
        </div>
        <div class="grid2">
          <div class="field">
            <label>客户</label>
            <input id="f_client" type="text" placeholder="如 温莎" />
          </div>
          <div class="field">
            <label>档期日 *</label>
            <input id="f_date" type="date" />
          </div>
        </div>
        <div class="field">
          <label>类型</label>
          <select id="f_type">
            <option value="拍摄">拍摄</option>
            <option value="活动">活动</option>
            <option value="婚礼">婚礼</option>
          </select>
        </div>

        <div class="sec-title">客户打款</div>
        <div class="grid2">
          <div class="field">
            <label>打款日</label>
            <input id="f_pay_date" type="date" />
          </div>
          <div class="field">
            <label>金额</label>
            <input id="f_pay_amount" type="number" inputmode="decimal" placeholder="0" />
          </div>
        </div>
        <div class="field">
          <label>打款方式</label>
          <select id="f_pay_method">
            <option value="">（未填）</option>
            <option value="微信">微信</option>
            <option value="支付宝">支付宝</option>
            <option value="银行转账">银行转账</option>
            <option value="现金">现金</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="sec-title">公帐到账</div>
        <div class="grid2">
          <div class="field">
            <label>到账日</label>
            <input id="f_pub_date" type="date" />
          </div>
          <div class="field">
            <label>到账金额</label>
            <input id="f_pub_amount" type="number" inputmode="decimal" placeholder="0" />
          </div>
        </div>

        <div class="sec-title">开票</div>
        <div class="grid2">
          <div class="field">
            <label>发票号</label>
            <input id="f_inv_no" type="text" placeholder="填了即视为已开票" />
          </div>
          <div class="field">
            <label>开票日</label>
            <input id="f_inv_date" type="date" />
          </div>
        </div>
        <div class="field">
          <label>已寄出</label>
          <select id="f_inv_sent">
            <option value="false">否</option>
            <option value="true">是</option>
          </select>
        </div>

        <div class="sec-title">交付</div>
        <div class="grid2">
          <div class="field">
            <label>拍摄完成日</label>
            <input id="f_shoot_done" type="date" />
          </div>
          <div class="field">
            <label>交付完成日</label>
            <input id="f_deliver_done" type="date" />
          </div>
        </div>
        <div class="field">
          <label>交付方式</label>
          <input id="f_deliver_method" type="text" placeholder="如 网盘 / U盘 / 邮寄" />
        </div>

        <div class="field">
          <label>备注</label>
          <input id="f_notes" type="text" placeholder="其他要记的事" />
        </div>

        <button type="button" class="btn btn-save" id="saveBtn">保存并同步</button>
        <button type="button" class="btn btn-ghost" id="newBtn">清空（新建）</button>
      </form>
    </section>

    <section class="card">
      <h2>全部档期 <span class="tag" id="countTag">0</span></h2>
      <div class="legend">
        <span><i style="background:var(--sage)"></i>拍摄</span>
        <span><i style="background:var(--gold)"></i>交付</span>
        <span><i style="background:var(--peach)"></i>开票</span>
        <span><i style="background:var(--brick)"></i>结款</span>
      </div>
      <div class="list" id="list"></div>
    </section>
  </section>

  <!-- 视图三：财务 -->
  <section class="view" id="view-finance">
    <div id="fin"></div>
    <p class="sub" style="text-align:center;margin-top:8px">口径：直客都应开票 · 介绍都不用开票</p>
  </section>

  <nav class="tabbar">
    <div class="tab active" data-view="schedule"><span class="ic">🗓️</span>档期</div>
    <div class="tab" data-view="input"><span class="ic">📝</span>录入</div>
    <div class="tab" data-view="finance"><span class="ic">💰</span>财务</div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>

  function b64dec(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g,"")))); }

  //   拍摄 = shootDone 非空
  //   交付 = deliverDone 非空
  //   开票 = invoice.no 非空
  //   结款 = publicAccount.amount > 0
  function stepState(p){
    return {
      shoot:   !!(p.shootDone && String(p.shootDone).trim() !== ""),
      deliver: !!(p.deliverDone && String(p.deliverDone).trim() !== ""),
      invoice: !!(p.invoice && p.invoice.no && String(p.invoice.no).trim() !== ""),
      paid:    !!(p.publicAccount && parseFloat(p.publicAccount.amount || 0) > 0),
    };
  }
  function stepDoneCount(p){
    var s = stepState(p);
    return (s.shoot?1:0) + (s.deliver?1:0) + (s.invoice?1:0) + (s.paid?1:0);
  }

  // 嵌套字段读写（支持 "payment.amount" 这类路径）
  function getField(p, path){
    var parts = String(path).split(".");
    var o = p;
    for(var i=0;i<parts.length-1;i++){ if(!o || typeof o[parts[i]] !== "object") return ""; o = o[parts[i]]; }
    return o ? o[parts[parts.length-1]] : "";
  }
  function setField(p, path, val){
    var parts = String(path).split(".");
    var o = p;
    for(var i=0;i<parts.length-1;i++){
      if(!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length-1]] = val;
  }
  function buildPatch(path, val){
    var parts = String(path).split(".");
    var patch = {}, cur = patch;
    for(var i=0;i<parts.length-1;i++){ cur[parts[i]] = {}; cur = cur[parts[i]]; }
    cur[parts[parts.length-1]] = val;
    return patch;
  }
  // 把 patch 合并进目标对象（保留未涉及字段）
  function applyPatch(target, patch){
    Object.keys(patch).forEach(function(k){
      if(patch[k] && typeof patch[k] === "object" && !Array.isArray(patch[k])){
        if(!target[k] || typeof target[k] !== "object") target[k] = {};
        applyPatch(target[k], patch[k]);
      } else {
        target[k] = patch[k];
      }
    });
  }

  function toast(msg){

  // ===== 数据加载 =====
  function authHeaders(){ return { "Authorization": "Bearer " + getToken(), "Accept": "application/vnd.github+json" }; }

  function loadData(){
    if(!getToken()){
      DATA = JSON.parse(JSON.stringify(DATA_SNAPSHOT));
      refreshAll();
      toast("未设置 token，当前为只读快照，点右上角 ⚙ 设置");
      return;
    }
    fetch(GH_API + "?t=" + Date.now(), { headers: authHeaders(), cache:"no-store" })
      .then(function(r){
        if(r.status === 401) throw new Error("token 无效或无权限");
        if(r.status === 404) return null;
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(d){
        if(!d || !d.content){
          DATA = JSON.parse(JSON.stringify(DATA_SNAPSHOT));
          toast("离线模式：显示内置快照");
        } else {
          DATA = JSON.parse(b64dec(d.content));
          if(!DATA || !Array.isArray(DATA.projects)) DATA = JSON.parse(JSON.stringify(DATA_SNAPSHOT));
        }
        refreshAll();
      })
      .catch(function(err){
        DATA = JSON.parse(JSON.stringify(DATA_SNAPSHOT));
        refreshAll();
        if(/401|token/i.test(err.message)) toast(err.message); // 坏 token 单独提示，不归到离线
        else toast("离线模式：显示内置快照");
      });
  }

  // 行内可编辑单元格（用于卡片详情网格）
  function edField(p, label, field, type, opts){
    opts = opts || {};
    var raw = getField(p, field);
    var disp, empty = false;
    if(type === "money"){
      var n = parseFloat(raw || 0);
      disp = n > 0 ? yuan(n) : "—";
      empty = !(n > 0);
    } else if(type === "date"){
      disp = raw ? fmtMD(raw) : "—";
      empty = !raw;
    } else {
      disp = (raw == null ? "" : String(raw)).trim();
      if(disp === ""){
        disp = opts.placeholder || "—";
        empty = true;
      } else {
        disp = esc(disp);
      }
    }
    var cls = "v" + (type === "money" ? " money" : "") + (empty ? " empty" : "");
    var dataOpts = opts.options ? ' data-options="'+opts.options.join(",")+'"' : "";
    var inputType = opts.inputType || (type === "money" ? "number" : type);
    return '<div class="row2"><div class="k">'+label+'</div>' +
      '<div class="'+cls+' editable" data-edit="'+field+'" data-id="'+p.id+'" data-type="'+inputType+'"'+dataOpts+'>'+disp+'</div></div>';
  }

          '<div class="amt uninv"><div class="k">未开票</div><div class="v">'+yuan(uninv)+'</div></div>' +
        '</div>' +
        '<div class="bar-wrap"><div class="bar-label"><span>应开 vs 实开</span><b>'+yuan(should)+' / '+yuan(invAmt)+'</b></div>' +
          '<div class="bar"><i style="width:'+pct+'%"></i></div></div>' +
        flag + detail;
      el.appendChild(card);
    });
  }

  // ===== 行内编辑核心 =====
  var _editing = false;
  function beginInlineEdit(el, opts){
    if(_editing) return;
    if(el.querySelector("input,select,textarea")) return;
    _editing = true;
    var type = opts.type || "text";
    var value = (opts.value == null ? "" : String(opts.value));
    var input;
    if(type === "select"){
      input = document.createElement("select");
      input.className = "inline-input";
      (opts.options || []).forEach(function(o){
        var op = document.createElement("option");
        op.value = o.value; op.textContent = o.label;
        if(String(o.value) === value) op.selected = true;
        input.appendChild(op);
      });
    } else {
      input = document.createElement("input");
      input.className = "inline-input";
      input.type = type;
      if(type === "number"){ input.step = "0.01"; input.min = "0"; input.inputMode = "decimal"; }
      input.value = value;
    }
    el.classList.add("editing");
    el.innerHTML = "";
    el.appendChild(input);
    input.focus();
    if(type === "text" || type === "number"){ try { input.select(); } catch(e){} }
    function commit(){
      if(!_editing) return;
      _editing = false;
      el.classList.remove("editing");
      opts.onCommit ? opts.onCommit(input.value) : null;
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); input.blur(); }
      else if(e.key === "Escape"){ _editing = false; el.classList.remove("editing"); if(opts.onCancel) opts.onCancel(); refreshAll(); }
    });
  }

  function handleEdit(el){
    var field = el.getAttribute("data-edit");
    var id = el.getAttribute("data-id");
    var type = el.getAttribute("data-type") || "text";
    var p = findProject(id);
    if(!p) return;
    var backup = JSON.parse(JSON.stringify(projects)); // 乐观更新前先打内存快照
    var curVal = getField(p, field);
    var displayVal;
    if(type === "number"){
      displayVal = (curVal === 0 || curVal === "" || curVal == null) ? "" : String(curVal);
    } else if(type === "date"){
      displayVal = curVal || "";
    } else {
      displayVal = curVal == null ? "" : String(curVal);
    }
    var opts = { type: type, value: displayVal, id: id, field: field };
    var optionsAttr = el.getAttribute("data-options");
    if(optionsAttr){
      opts.options = optionsAttr.split(",").map(function(o){ return { value:o, label:o }; });
    }
    opts.onCommit = function(raw){
      var newVal = raw;
      if(type === "number"){
        newVal = raw === "" ? 0 : (parseFloat(String(raw).replace(/[^0-9.]/g,"")) || 0);
      } else if(type === "date"){
        newVal = raw || "";
      } else {
        newVal = String(raw == null ? "" : raw).trim();
      }
      setField(p, field, newVal);
      updateProject(id, buildPatch(field, newVal), function(ok){
        if(!ok){ // PUT 失败：回滚到编辑前的快照，避免 UI 误显示已保存
          projects = backup;
          DATA.projects = backup.slice();
          refreshAll();
        }
      });
    };
    beginInlineEdit(el, opts);
  }

  // 状态点切换（拍摄/交付/开票/结款）
  function toggleStatus(id, key){
    var p = findProject(id);
    if(!p) return;
    var backup = JSON.parse(JSON.stringify(projects)); // 乐观更新前先打内存快照
    var patch = {};
    if(key === "shoot"){
      var onS = !(p.shootDone && String(p.shootDone).trim() !== "");
      var sd = onS ? (p.date || todayStr()) : "";
      setField(p, "shootDone", sd);
      patch = { shootDone: sd };
    } else if(key === "deliver"){
      var onD = !(p.deliverDone && String(p.deliverDone).trim() !== "");
      var dd = onD ? (p.date || todayStr()) : "";
      setField(p, "deliverDone", dd);
      patch = { deliverDone: dd };
    } else if(key === "invoice"){
      var onI = !(p.invoice && p.invoice.no && String(p.invoice.no).trim() !== "");
      var ino = onI ? "已开票" : "";
      setField(p, "invoice.no", ino);
      patch = { invoice: { no: ino } };
    } else if(key === "paid"){
      var onP = !(parseFloat((p.publicAccount && p.publicAccount.amount) || 0) > 0);
      var amt;
      if(onP){
        amt = parseFloat((p.payment && p.payment.amount) || 0);
        if(!(amt > 0)){
          var input = prompt("结款金额（公帐到账）：", "");
          amt = input == null ? 0 : (parseFloat(String(input).replace(/[^0-9.]/g,"")) || 0);
        }
      } else {
        amt = 0;
      }
      setField(p, "publicAccount.amount", amt);
      patch = { publicAccount: { amount: amt } };
    }
    updateProject(id, patch, function(ok){
      if(!ok){ // PUT 失败：回滚到切换前的快照，避免 UI 误显示已保存
        projects = backup;
        DATA.projects = backup.slice();
        refreshAll();
      }
    });
  }

  // 档期卡片点击：编辑 / 切换状态 / 展开
  function onCardsClick(e){
    var toggleEl = e.target.closest("[data-toggle]");
    if(toggleEl){ toggleStatus(toggleEl.getAttribute("data-id"), toggleEl.getAttribute("data-toggle")); return; }
    var editEl = e.target.closest("[data-edit]");
    if(editEl){ handleEdit(editEl); return; }
    var head = e.target.closest(".card-head");
    if(head){
      var id = head.getAttribute("data-id");
      if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
      head.closest(".scard").classList.toggle("open");
    }
  }

  // 财务明细内联编辑
  function onFinClick(e){
    var editEl = e.target.closest("[data-edit]");
    if(editEl){ handleEdit(editEl); }
  }

  // ===== 写回 GitHub：只更新该条 project 的对应字段，再 PUT 整个 data.json =====
  // 复用 save() 的思路：先 GET 拿 sha，再 PUT 覆盖写。
  function updateProject(id, patch, done){
    if(!needToken()){ if(done) done(false); return; }
    fetch(GH_API + "?t=" + Date.now(), { headers: authHeaders(), cache:"no-store" })
      .then(function(r){
        if(r.status === 401) throw new Error("token 无效");
        if(r.status === 404) return { projects: [], sha: null };
        if(!r.ok) throw new Error("读取失败 HTTP " + r.status);
        return r.json().then(function(d){
          var parsed = JSON.parse(b64dec(d.content));
          return { projects: Array.isArray(parsed.projects) ? parsed.projects : [], sha: d.sha };
        });
      })
      .then(function(remote){
        var arr = (remote.projects || []).slice();
        var target = arr.filter(function(x){ return x.id === id; })[0];
        if(!target){
          var localP = findProject(id);
          if(!localP) throw new Error("找不到该项目");
          target = JSON.parse(JSON.stringify(localP));
          applyPatch(target, patch);
          arr.push(target);
        } else {
          applyPatch(target, patch);
        }
        var payload = { updatedAt: new Date().toISOString(), projects: arr };
        var body = { message: "update project via mobile", content: b64enc(JSON.stringify(payload)), branch: GH_BRANCH };
        if(remote.sha) body.sha = remote.sha;
        return fetch(GH_API, {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
          body: JSON.stringify(body),
        }).then(function(r){ return { ok: r.ok, status: r.status }; });
      })
      .then(function(res){
        if(res.ok){
          // 更新内存并整页重渲染
          var t = findProject(id);
          if(t) applyPatch(t, patch);
          refreshAll();
          toast("已保存 ✓");
          if(done) done(true);
        } else {
          toast("同步失败：" + res.status);
          if(done) done(false);
          refreshAll();
        }
      })
      .catch(function(err){ toast("保存出错：" + err.message); if(done) done(false); });
  }

  // ===== 表单 <-> 数据 =====
  function readForm(){
    return {
      id: $("f_id").value || ("p-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,7)),
      name: $("f_name").value.trim(),
      client: $("f_client").value.trim(),
      date: $("f_date").value,
      type: $("f_type").value,
      payment: {
        date: $("f_pay_date").value,
        amount: num($("f_pay_amount").value),
        method: $("f_pay_method").value,
      },
      publicAccount: {
        date: $("f_pub_date").value,
        amount: num($("f_pub_amount").value),
      },
      invoice: {
        no: $("f_inv_no").value.trim(),
        date: $("f_inv_date").value,
        sent: $("f_inv_sent").value === "true",
      },
      shootDone: $("f_shoot_done").value,
      deliverDone: $("f_deliver_done").value,
      deliverMethod: $("f_deliver_method").value.trim(),
      notes: $("f_notes").value.trim(),
    };
  }

  function writeForm(p){
    $("f_id").value = p.id || "";
    $("f_name").value = p.name || "";
    $("f_client").value = p.client || "";
    $("f_date").value = p.date || "";
    $("f_type").value = p.type || "拍摄";
    $("f_pay_date").value = (p.payment && p.payment.date) || "";
    $("f_pay_amount").value = (p.payment && p.payment.amount) || "";
    $("f_pay_method").value = (p.payment && p.payment.method) || "";
    $("f_pub_date").value = (p.publicAccount && p.publicAccount.date) || "";
    $("f_pub_amount").value = (p.publicAccount && p.publicAccount.amount) || "";
    $("f_inv_no").value = (p.invoice && p.invoice.no) || "";
    $("f_inv_date").value = (p.invoice && p.invoice.date) || "";
    $("f_inv_sent").value = (p.invoice && p.invoice.sent) ? "true" : "false";
    $("f_shoot_done").value = p.shootDone || "";
    $("f_deliver_done").value = p.deliverDone || "";
    $("f_deliver_method").value = p.deliverMethod || "";
    $("f_notes").value = p.notes || "";
  }

  function clearForm(){
    $("form").reset();
    $("f_id").value = "";
    $("f_type").value = "拍摄";
    $("f_inv_sent").value = "false";
    $("modeTag").textContent = "新增";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function loadIntoForm(id){
    var p = (DATA.projects||[]).filter(function(x){ return x.id === id; })[0];
    if(!p) return;
    writeForm(p);
    $("modeTag").textContent = "编辑中";
    switchView("input");
    window.scrollTo({top:0, behavior:"smooth"});
  }

  // ===== 保存（GitHub PUT，录入表单用）=====
  function save(){
    var name = $("f_name").value.trim();
    var date = $("f_date").value;
    if(!name || !date){ toast("请填「项目名」和「档期日」"); return; }
    if(!needToken()) return;

    fetch(GH_API + "?t=" + Date.now(), { headers: authHeaders(), cache:"no-store" })
      .then(function(r){
        if(r.status === 404) return { projects: [], sha: null };
        if(!r.ok) throw new Error("读取失败 HTTP " + r.status);
        return r.json().then(function(d){
          var parsed = JSON.parse(b64dec(d.content));
          return { projects: Array.isArray(parsed.projects) ? parsed.projects : [], sha: d.sha };
        });
      })
      .then(function(remote){
        var arr = remote.projects.slice();
        var proj = readForm();
        var idx = -1;
        for(var i=0;i<arr.length;i++){ if(arr[i].id === proj.id){ idx = i; break; } }
        if(idx >= 0){
          // 保留表单未覆盖的字段（来源/展示名/日历镜像）
          ["mirror","source","displayName"].forEach(function(k){ if(!(k in proj) || !proj[k]) proj[k] = arr[idx][k]; });
          arr[idx] = proj;
        } else {
          arr.push(proj);
        }
        var payload = { updatedAt: new Date().toISOString(), projects: arr };
        var body = { message: "update data.json via mobile", content: b64enc(JSON.stringify(payload)), branch: GH_BRANCH };
        if(remote.sha) body.sha = remote.sha;
        return fetch(GH_API, {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
          body: JSON.stringify(body),
        }).then(function(r){ return { ok: r.ok, status: r.status }; });
      })
      .then(function(res){
        if(res.ok){
          // 更新内存 + 重渲染 + 清空表单
          var proj = readForm();
          var arr = DATA.projects || [];
          var found = false;
          for(var i=0;i<arr.length;i++){ if(arr[i].id === proj.id){ arr[i] = proj; found = true; break; } }
          if(!found) arr.push(proj);
          DATA.projects = arr;
          refreshAll();
          clearForm();
          toast("已同步 ✓");
        } else {
          toast("同步失败：" + res.status);
        }
      })
      .catch(function(err){ toast("保存出错：" + err.message); });
  }

  // ===== Tab 切换 =====
  function switchView(v){
    document.querySelectorAll(".view").forEach(function(s){ s.classList.remove("active"); });
    var tv = $("view-" + v); if(tv) tv.classList.add("active");
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.view === v); });
  }

  // ===== 绑定 =====
  $("saveBtn").addEventListener("click", save);
  $("newBtn").addEventListener("click", clearForm);
  $("setTokenBtn").addEventListener("click", function(){
    var t = prompt("粘贴你的 GitHub token（仅限 photoflow 仓库读写权限即可）：\n\ntoken 只存在你这部手机本地，不会上传。", getToken());
    if(t && t.trim()){ setToken(t.trim()); toast("token 已保存 ✓"); loadData(); }
  });
  document.querySelectorAll(".tab").forEach(function(t){ t.onclick = function(){ switchView(t.dataset.view); }; });
  $("cards").addEventListener("click", onCardsClick);
  $("fin").addEventListener("click", onFinClick);

  // ===== 初始化 =====
  buildChips();
  loadData();
})();
</script>
