<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9CAA8A">
<title>摄影档期总表 · 2026</title>
<style>
  :root{
    --cream:#FAF4E8;
    --cream-2:#F4EBD6;
    --sage:#9CAA8A;
    --sage-deep:#5C7152;
    --peach:#E8A48A;
    --peach-deep:#C77A5C;
    --gold:#D9A85C;
    --brick:#B85440;
    --ink:#3A2E22;
    --ink-soft:#6E5E4E;
    --line:rgba(58,46,34,0.12);
    --card:#fff;
    --shadow:0 2px 10px rgba(92,113,82,0.10);
    --tab-h:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));}
  .app{max-width:880px;margin:0 auto}
  header.top{text-align:center;padding:18px 16px 14px;position:sticky;top:0;background:linear-gradient(var(--cream),rgba(250,244,232,0.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;border-bottom:1px solid var(--line)}
  h1{font-size:20px;color:var(--sage-deep);letter-spacing:.5px}
  .sub{color:var(--ink-soft);font-size:12px;margin-top:2px}

  .view{padding:14px 14px 24px;display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 筛选 chips */
  .chips{display:flex;gap:10px;margin-bottom:14px}
  .chip{flex:1;min-height:44px;border:1px solid var(--line);background:var(--cream);color:var(--ink-soft);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
  .chip.active{background:var(--sage);border-color:var(--sage);color:#fff}

  /* 概览 */
  .ov{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .ov .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
  .ov .lbl{font-size:11px;color:var(--ink-soft)}
  .ov .num{font-size:20px;font-weight:700;color:var(--sage-deep);font-variant-numeric:tabular-nums;margin-top:2px}
  .ov .num.peach{color:var(--peach-deep)}
  .ov .num.gold{color:var(--gold)}

  /* 档期卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:64px;cursor:pointer}
  .date-badge{flex:0 0 auto;text-align:center;background:var(--cream-2);border-radius:12px;padding:6px 10px;min-width:56px}
  .date-badge .d{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
  .date-badge .m{font-size:11px;color:var(--ink-soft)}
  .card-main{flex:1;min-width:0}
  .card-title{font-weight:600;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
  .tag.direct{background:rgba(217,168,92,.2);color:#9C7A2C}
  .tag.friend{background:rgba(156,170,138,.22);color:var(--sage-deep)}
  .tag.type{background:var(--cream-2);color:var(--ink-soft)}
  .card-sub{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .dots{display:inline-flex;gap:5px}
  .dot{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff}
  .dot.on{border-color:var(--sage);background:var(--sage);color:#fff}
  .cal-badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .cal-badge.synced{background:rgba(156,170,138,.18);color:var(--sage-deep);border-color:transparent}
  .cal-badge.unsynced{background:rgba(184,84,64,.1);color:var(--brick);border-color:transparent}
  .chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .2s;font-size:14px}
  .card.open .chev{transform:rotate(180deg)}
  .card-detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .card.open .card-detail{max-height:560px}
  .detail-inner{padding:14px 16px;border-top:1px solid var(--line)}
  .rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
  .row{background:var(--cream);border-radius:10px;padding:8px 10px}
  .row .k{font-size:11px;color:var(--ink-soft)}
  .row .v{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-word}
  .row .v.money{color:var(--peach-deep)}
  .steps-row{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
  .step{flex:1;min-width:64px;text-align:center;background:var(--cream);border-radius:10px;padding:8px 4px;font-size:12px}
  .step .sd{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff}
  .step.done .sd{border-color:var(--sage);background:var(--sage);color:#fff}
  .step .sl{color:var(--ink-soft)}
  .step.done .sl{color:var(--sage-deep);font-weight:600}
  .notes-box{font-size:13px;color:var(--ink-soft);background:var(--cream-2);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word}

  /* 财务 */
  .fin-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);border-left:5px solid var(--gold)}
  .fin-card.friend{border-left-color:var(--sage)}
  .fin-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .fin-name{font-size:18px;font-weight:700;color:var(--ink)}
  .fin-cnt{font-size:12px;color:var(--ink-soft)}
  .amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .amt{background:var(--cream);border-radius:12px;padding:12px;text-align:center}
  .amt .k{font-size:11px;color:var(--ink-soft)}
  .amt .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
  .amt.rev .v{color:var(--peach-deep)}
  .amt.inv .v{color:var(--sage-deep)}
  .amt.uninv .v{color:var(--brick)}
  .bar-wrap{margin-top:4px}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .bar-label b{color:var(--ink);font-variant-numeric:tabular-nums}
  .bar{height:14px;background:var(--cream-2);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-deep));border-radius:999px;transition:width .4s}
  .fin-flag{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:10px;line-height:1.5}
  .fin-flag.warn{background:rgba(184,84,64,.12);color:var(--brick)}
  .fin-flag.ok{background:rgba(156,170,138,.18);color:var(--sage-deep)}
  .fin-flag.info{background:var(--cream-2);color:var(--ink-soft)}

  /* 底部 Tab（手机端优先） */
  .tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-soft);font-size:12px;font-weight:500;cursor:pointer;min-height:var(--tab-h);-webkit-tap-highlight-color:transparent}
  .tab .ic{font-size:20px;line-height:1;transition:transform .15s}
  .tab.active{color:var(--sage-deep)}
  .tab.active .ic{transform:scale(1.12)}

  @media (min-width:720px){
    h1{font-size:24px}
    .ov{grid-template-columns:repeat(4,1fr)}
    .rows{grid-template-columns:repeat(4,1fr)}
    .card-head{padding:16px 20px;min-height:70px}
    .card-title{font-size:17px}
  }
</style>
</head>

</div>

// 4 个状态点（与 reconcile.py 完全一致）
function stepState(p) {
  return {
    shoot:   !!(p.shootDone && String(p.shootDone).trim()),
    deliver: !!(p.deliverDone && String(p.deliverDone).trim()),
    invoice: !!(p.invoice && p.invoice.no && String(p.invoice.no).trim()),
    paid:    !!(p.publicAccount && parseFloat(p.publicAccount.amount || 0) > 0),
  };
}
function stepDoneCount(p) {
  const s = stepState(p);
  return (s.shoot ? 1 : 0) + (s.deliver ? 1 : 0) + (s.invoice ? 1 : 0) + (s.paid ? 1 : 0);
}
// 日历同步状态（mirror.calendar.exists；沙箱里默认 false）
function calSynced(p) { return !!(p.mirror && p.mirror.calendar && p.mirror.calendar.exists); }

// 营收口径（与 reconcile 一致）：结款(公帐)>0 用公帐金额，否则用 payment 金额
function projectRevenue(p) {
  const pub = parseFloat((p.publicAccount && p.publicAccount.amount) || 0);
  if (pub > 0) return pub;
  return parseFloat((p.payment && p.payment.amount) || 0);
}
function invoiceAmount(p) { return stepState(p).invoice ? projectRevenue(p) : 0; }

document.getElementById("upd").textContent = data.updatedAt ? data.updatedAt.replace("T", " ").replace(/\..*/, "") : "--";
document.getElementById("totalCnt").textContent = projects.length;

// ---- 顶部概览 ----
const ovEl = document.getElementById("ov");
const total = projects.length;
const doneShoot = projects.filter(p => stepState(p).shoot).length;
const totalRev = projects.reduce((s, p) => s + projectRevenue(p), 0);
const invoicedAmt = projects.reduce((s, p) => s + invoiceAmount(p), 0);
[
  ["总档期", total, ""],
  ["已拍摄", doneShoot, ""],
  ["总营收", "¥" + totalRev.toLocaleString(), "peach"],
  ["已开票", "¥" + invoicedAmt.toLocaleString(), "gold"],
].forEach(([lbl, num, cls]) => {
  const d = document.createElement("div");
  d.className = "box";
  d.innerHTML = `<div class="lbl">${lbl}</div><div class="num ${cls}">${num}</div>`;
  ovEl.appendChild(d);
});

// ---- 档期视图：来源筛选 + 可展开卡片 ----
let curSource = "全部";
const expanded = new Set();

function buildChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  ["全部", "直客", "介绍"].forEach(s => {
    const b = document.createElement("button");
    b.className = "chip" + (s === curSource ? " active" : "");
    b.textContent = s === "全部" ? "全部来源" : s;
    b.onclick = () => { curSource = s; buildChips(); renderCards(); };
    el.appendChild(b);
  });
}

function renderCards() {
  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";
  const filtered = projects.filter(p => curSource === "全部" || getSource(p) === curSource);
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";
  filtered.forEach(p => {
    const st = stepState(p);
    const src = getSource(p);
    const id = p.id;
    const card = document.createElement("div");
    card.className = "card" + (expanded.has(id) ? " open" : "");
    const doneN = stepDoneCount(p);
    const parts = (p.date || "").split("-");
    const yy = parts[0] || "", mm = parts[1] || "", dd = parts[2] || "";
    const dots = STEP_LABELS.map((lab, i) => `<span class="dot ${st[STEP_KEYS[i]] ? "on" : ""}" title="${lab}"></span>`).join("");
    const calBadge = calSynced(p)
      ? `<span class="cal-badge synced">📅 已同步</span>`
      : `<span class="cal-badge unsynced">📅 未同步</span>`;
    const rev = projectRevenue(p);
    card.innerHTML = `
      <div class="card-head">
        <div class="date-badge"><div class="d">${dd || "?"}</div><div class="m">${yy}/${mm}</div></div>
        <div class="card-main">
          <div class="card-title">${dispName(p)}
            <span class="tag ${src === "直客" ? "direct" : "friend"}">${src}</span>
            <span class="tag type">${p.type || "—"}</span>
          </div>
          <div class="card-sub">
            <span class="dots" title="拍摄/交付/开票/结款">${dots}</span>
            <span style="font-size:12px;color:var(--ink-soft)">${doneN}/4</span>
            ${calBadge}
          </div>
        </div>
        <span class="chev">▾</span>
      </div>
      <div class="card-detail"><div class="detail-inner">
        <div class="rows">
          <div class="row"><div class="k">日期</div><div class="v">${fmtMD(p.date)}</div></div>
          <div class="row"><div class="k">客户 / 来源</div><div class="v">${p.client || "—"} · ${src}</div></div>
          <div class="row"><div class="k">营收</div><div class="v money">${rev > 0 ? "¥" + rev.toLocaleString() : "—"}</div></div>
          <div class="row"><div class="k">类型</div><div class="v">${p.type || "—"}</div></div>
        </div>
        <div class="steps-row">
          ${STEP_LABELS.map((lab, i) => `<div class="step ${st[STEP_KEYS[i]] ? "done" : ""}"><div class="sd">${st[STEP_KEYS[i]] ? "✓" : lab[0]}</div><div class="sl">${lab}</div></div>`).join("")}
        </div>
        <div class="notes-box">${p.notes ? "📝 " + p.notes : "暂无备注"}</div>
      </div></div>`;
    card.querySelector(".card-head").onclick = () => {
      if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
      card.classList.toggle("open");
    };
    wrap.appendChild(card);
  });
}

// ---- 财务视图：按来源分组统计 ----
function renderFinance() {
  const el = document.getElementById("fin");
  el.innerHTML = "";
  ["直客", "介绍"].forEach(src => {
    const list = projects.filter(p => getSource(p) === src);
    const rev = list.reduce((s, p) => s + projectRevenue(p), 0);
    const invAmt = list.reduce((s, p) => s + invoiceAmount(p), 0);
    const uninv = rev - invAmt;
    const should = src === "直客" ? rev : 0;            // 应开金额
    const gap = should - invAmt;                          // 应开 - 实开
    const pct = should > 0 ? Math.min(100, Math.round(invAmt / should * 100)) : (invAmt > 0 ? 100 : 0);
    let flag;
    if (src === "直客") {
      flag = gap > 0
        ? `<div class="fin-flag warn">⚠ 直客还差 ¥${gap.toLocaleString()} 未开票（应开未齐）</div>`
        : `<div class="fin-flag ok">✓ 直客应开已齐</div>`;
    } else {
      flag = invAmt > 0
        ? `<div class="fin-flag info">介绍单已开票 ¥${invAmt.toLocaleString()}（按口径介绍无需开票）</div>`
        : `<div class="fin-flag info">介绍单无需开票</div>`;
    }
    const card = document.createElement("div");
    card.className = "fin-card" + (src === "介绍" ? " friend" : "");
    card.innerHTML = `
      <div class="fin-head">
        <span class="fin-name">${src}</span>
        <span class="fin-cnt">${list.length} 单</span>
      </div>
      <div class="amt-grid">
        <div class="amt rev"><div class="k">总营收</div><div class="v">¥${rev.toLocaleString()}</div></div>
        <div class="amt inv"><div class="k">已开票</div><div class="v">¥${invAmt.toLocaleString()}</div></div>
        <div class="amt uninv"><div class="k">未开票</div><div class="v">¥${uninv.toLocaleString()}</div></div>
      </div>
      <div class="bar-wrap">
        <div class="bar-label"><span>应开 vs 实开</span><b>¥${should.toLocaleString()} / ¥${invAmt.toLocaleString()}</b></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
      ${flag}`;
    el.appendChild(card);
  });
}

// ---- 底部 Tab 切换 ----
function switchView(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.remove("active"));
  document.getElementById("view-" + v).classList.add("active");
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === v));
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => switchView(t.dataset.view); });

// ---- 初始化 ----
buildChips();
renderCards();
renderFinance();
</script>
</body>
</html>
