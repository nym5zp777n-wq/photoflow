<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影档期总表 · 2026</title>
<style>
  :root{
    --cream:#FAF4E8;
    --cream-2:#F4EBD6;
    --sage:#9CAA8A;
    --sage-deep:#5C7152;
    --peach:#E8A48A;
    --peach-deep:#C77A5C;
    --gold:#D9A85C;
    --brick:#B85440;
    --ink:#3A2E22;
    --ink-soft:#6E5E4E;
    --line:rgba(58,46,34,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
  header{text-align:center;padding:20px 0 32px;border-bottom:1px solid var(--line);margin-bottom:32px}
  h1{font-size:30px;color:var(--sage-deep);letter-spacing:1px;margin-bottom:8px}
  .sub{color:var(--ink-soft);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:36px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 2px 6px rgba(92,113,82,0.06)}
  .stat .lbl{font-size:12px;color:var(--ink-soft);letter-spacing:0.5px}
  .stat .num{font-size:26px;font-weight:600;color:var(--sage-deep);margin-top:4px}
  .stat.brick .num{color:var(--brick)}
  .stat.peach .num{color:var(--peach-deep)}
  .stat.gold .num{color:#9C7A2C}
  .month{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:24px;overflow:hidden;box-shadow:0 2px 8px rgba(92,113,82,0.06)}
  .month-head{background:var(--cream-2);padding:14px 20px;font-weight:600;color:var(--sage-deep);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .month-head .count{font-size:13px;color:var(--ink-soft);font-weight:400}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:12px 20px;font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:0.5px;border-bottom:1px solid var(--line);background:var(--cream)}
  td{padding:14px 20px;font-size:14px;border-bottom:1px solid rgba(58,46,34,0.05);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover{background:rgba(156,170,138,0.06)}
  .name{font-weight:500;color:var(--ink)}
  .date{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .client{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--cream-2);font-size:12px;color:var(--ink-soft)}
  .client.direct{background:rgba(217,168,92,0.18);color:#9C7A2C}
  .client.friend{background:rgba(156,170,138,0.20);color:var(--sage-deep)}
  .money{font-variant-numeric:tabular-nums;font-weight:500;color:var(--peach-deep);white-space:nowrap}
  .money.zero{color:var(--ink-soft);font-weight:400}
  .steps{display:inline-flex;gap:4px}
  .dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;border:1.5px solid var(--line);color:var(--ink-soft);background:#fff}
  .dot.on{border-color:var(--sage);background:var(--sage);color:#fff}
  .notes{font-size:12px;color:var(--ink-soft);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:28px;font-size:13px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .dot{position:static}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
  @media (max-width:720px){
    .wrap{padding:16px 12px 60px}
    th,td{padding:10px 8px;font-size:13px}
    .notes{display:none}
    .stat .num{font-size:22px}
    h1{font-size:24px}
  }
</style>
</head>

<div class="wrap">
  <header>

  </header>

  <div class="stats" id="stats"></div>
  <div class="legend">

    <span>4 个状态点代表：</span>
    <span>拍摄</span><span>交付</span><span>开票</span><span>结款</span>

  <div id="months"></div>

  <footer>

</div>

<script>
const data = DATA;
const fmt = d => d ? d.replace(/-/g,'/') : '';
const monthKey = d => d ? d.slice(0,7) : 'unknown';

const projects = data.projects.slice().sort((a,b)=>b.date.localeCompare(a.date));

// 更新头
document.getElementById('upd').textContent = data.updatedAt ? data.updatedAt.replace('T',' ').replace(/\..*/,'') : '--';
document.getElementById('totalCnt').textContent = projects.length;

// 4 个状态
function stepState(p){
  return {
    shoot: !!p.shootDone,
    deliver: !!p.deliverDone,
    invoice: !!(p.invoice && p.invoice.no),
    paid: !!(p.publicAccount && p.publicAccount.amount>0)
  };
}

// 顶部统计
const statBox = document.getElementById('stats');
const total = projects.length;
const done = projects.filter(p=>p.shootDone).length;
const invoiced = projects.filter(p=>p.invoice && p.invoice.no).length;
const withMoney = projects.filter(p=>p.payment && p.payment.amount>0).length;
const totalAmount = projects.reduce((s,p)=>s+(p.payment?.amount||0),0);
const stats = [
  ['总档期', total, ''],
  ['已拍摄', done, ''],
  ['已开票', invoiced, ''],
  ['有金额记录', withMoney, ''],
  ['总营收', '¥'+totalAmount.toLocaleString(), 'peach'],
];
stats.forEach(([lbl,num,cls])=>{
  const d=document.createElement('div');
  d.className='stat '+(cls||'');
  d.innerHTML=`<div class="lbl">${lbl}</div><div class="num">${num}</div>`;
  statBox.appendChild(d);
});

// 按月分组
const groups = {};
projects.forEach(p=>{
  const k = monthKey(p.date);
  (groups[k] = groups[k] || []).push(p);
});

const monthsEl = document.getElementById('months');
const monthNames = {01:'一月',02:'二月',03:'三月',04:'四月',05:'五月',06:'六月',07:'七月',08:'八月',09:'九月',10:'十月',11:'十一月',12:'十二月'};
Object.keys(groups).sort().forEach(mk=>{
  const list = groups[mk];
  const [yy,mm] = mk.split('-');
  const monthAmt = list.reduce((s,p)=>s+(p.payment?.amount||0),0);
  const box = document.createElement('div');
  box.className='month';
  box.innerHTML=`
    <div class="month-head">
      <span>${yy} 年 ${monthNames[mm]||mm}</span>
      <span class="count">${list.length} 条 · 营收 ¥${monthAmt.toLocaleString()}</span>
    </div>
    <table>
      <thead><tr>
        <th>项目</th><th>日期</th><th>客户/来源</th><th>金额</th><th>拍摄</th><th>交付</th><th>开票</th><th>结款</th><th>备注</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  `;
  const tb = box.querySelector('tbody');
  list.forEach(p=>{
    const st = stepState(p);
    const isDirect = (p.client||'').includes('直客') || (p.notes||'').includes('直客');
    const tr = document.createElement('tr');
    tr.innerHTML=`
      <td><div class="name">${p.name||''}</div></td>
      <td class="date">${fmt(p.date)}</td>
      <td><span class="client ${isDirect?'direct':'friend'}">${p.client||''}</span></td>
      <td class="money ${(p.payment?.amount||0)===0?'zero':''}">${(p.payment?.amount||0)>0?'¥'+p.payment.amount.toLocaleString():'—'}</td>
      <td><span class="steps"><i class="dot ${st.shoot?'on':''}"></i></span></td>
      <td><span class="steps"><i class="dot ${st.deliver?'on':''}"></i></span></td>
      <td><span class="steps"><i class="dot ${st.invoice?'on':''}"></i></span></td>
      <td><span class="steps"><i class="dot ${st.paid?'on':''}"></i></span></td>
      <td class="notes" title="${p.notes||''}">${p.notes||''}</td>
    `;
    tb.appendChild(tr);
  });
  monthsEl.appendChild(box);
});
</script>
